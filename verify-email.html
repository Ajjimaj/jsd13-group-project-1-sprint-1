<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify the e-mail Wireframe (1440x1024)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #d8d8d8;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Fixed 1440px x 1024px Viewport Canvas Frame */
    .canvas-frame {
      width: 1440px;
      height: 1024px;
      background-color: #d8d8d8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
    }

    /* Main White Card Container */
    .card-container {
      background: #ffffff;
      border-radius: 20px;
      width: 1320px;
      height: 800px;
      display: grid;
      grid-template-columns: 560px 1fr;
      padding: 32px;
      gap: 60px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.08);
    }

    .hero-panel {
      background-color: #d5d5d5;
      border: 1px solid #222222;
      border-radius: 14px;
      height: 100%;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .logo-badge {
      background-color: #6d6d6d;
      color: #ffffff;
      font-size: 32px;
      font-weight: 500;
      padding: 10px 28px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .back-btn {
      background-color: #ffffff;
      color: #333333;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 22px;
      border-radius: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* Right Form Panel */
    .form-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px 60px 20px 20px;
    }

    .form-title {
      font-size: 52px;
      font-weight: 800;
      color: #111111;
      margin-bottom: 24px;
      letter-spacing: -1px;
    }

    .subtitle {
      font-size: 14px;
      font-weight: 700;
      color: #111111;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #111111;
      margin-bottom: 10px;
    }

    .input-field {
      width: 100%;
      height: 56px;
      background-color: #dcdcdc;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-size: 16px;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      height: 56px;
      background-color: #e6ddfa;
      border: 1px solid #111111;
      border-radius: 2px;
      font-size: 14px;
      font-weight: 600;
      color: #111111;
      cursor: pointer;
      margin-top: 12px;
      transition: background-color 0.2s;
    }

    .submit-btn:hover {
      background-color: #dcd0f7;
    }

    /* Responsive adjustments */
    @media (max-width: 1440px) {
      .canvas-frame {
        width: 100vw;
        height: auto;
        min-height: 100vh;
        padding: 20px;
      }
      .card-container {
        width: 100%;
        max-width: 1320px;
        height: auto;
        min-height: 750px;
      }
    }

    @media (max-width: 900px) {
      .card-container {
        grid-template-columns: 1fr;
        gap: 32px;
      }
      .hero-panel {
        height: 320px;
      }
      .form-panel {
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="canvas-frame">
    <div class="card-container">
      <div class="hero-panel">
        <div class="logo-badge">Logo</div>
        <a href="#" class="back-btn">Back to website</a>
        <div class = "football-image">
        <img src="https://www.anthropics.com/portraitpro/img/page-images/homepage/v22/what-can-it-do-5A.jpg" alt="football" style="width: 100%; max-width: 600px; height: auto; border-radius: 8px;">
      </div>
      </div>

      <!-- Right Verify the e-mail Form Panel -->
      <div class="form-panel">
        <h1 class="form-title">Verify the e-mail</h1>
        
        <p class="subtitle">Password problem? We got you!</p>

        <form onsubmit="event.preventDefault();">
          <div class="form-group">
            <label class="form-label">Your e-mail:</label>
            <input type="email" class="input-field" placeholder="" aria-label="Your e-mail">
          </div>

          <div class="form-group">
            <label class="form-label">New password :</label>
            <input type="password" class="input-field" placeholder="" aria-label="New password">
          </div>

          <button type="submit" class="submit-btn">Reset password</button>
        </form>
      </div>

    </div>
  </div>

</body>
</html>
